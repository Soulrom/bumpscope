[project]
name = "bumpscope"
version = "0.1.0"
description = "See which dependency updates actually affect your Python code, before you upgrade."
readme = "README.md"
authors = [
    { name = "Soulrom" }
]
requires-python = ">=3.12"
dependencies = [
    "griffe>=2.3.0",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
bumpscope = "bumpscope.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
